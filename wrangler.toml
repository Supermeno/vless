name = "vless-worker"
main = "_worker.js"
compatibility_date = "2026-08-28"

# Cloudflare Workers compatibility flags
# Enable Node.js compatibility for crypto.subtle
compatibility_flags = ["nodejs_compat"]

# ============================================
# ENVIRONMENT VARIABLES (Public)
# ============================================
[vars]
WS_PATH = "vless-ws"
LOG_LEVEL = "info"

# ============================================
# SECRETS (Use 'wrangler secret put' to set)
# ============================================
# UUID = "your-uuid-here"          # wrangler secret put UUID
# PROXYIP = "cdn-b100.xn--b6gac.eu.org"  # wrangler secret put PROXYIP
# PROXY_LIST_URL = ""              # wrangler secret put PROXY_LIST_URL
# DNS_RESOLVER_URL = ""            # wrangler secret put DNS_RESOLVER_URL

# ============================================
# ROUTES (Optional - for custom domain)
# ============================================
# [[routes]]
# pattern = "proxy.yourdomain.com/*"
# custom_domain = true

# ============================================
# KV NAMESPACE (Optional - for dynamic config)
# ============================================
# [[kv_namespaces]]
# binding = "CONFIG"
# id = "your-kv-namespace-id"

# ============================================
# DURABLE OBJECTS (Optional)
# ============================================
# [[durable_objects.bindings]]
# name = "RATE_LIMITER"
# class_name = "RateLimiter"

# ============================================
# ANALYTICS (Optional)
# ============================================
# [observability]
# enabled = true
# head_sampling_rate = 1
